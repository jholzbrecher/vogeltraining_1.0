<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: linear-gradient(180deg, #e9e9e9, #dcdcdc);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.secondary {
    background: #e9ecef;
    color: #333;
}

.secondary:hover {
    background: #dcdfe3;
}

#app {
    width: 420px;
    max-width: 92vw;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 20px;
}

h1 {
    font-size: 20px;
    margin-bottom: 10px;
    text-align: center;
}

h2 {
    font-size: 15px;
    margin: 15px 0 5px;
}

/* HUD */
#hud {
    font-size: 16px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    padding: 10px;
    background: #f3f3f3;
    border-radius: 12px;
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 14px;
    box-sizing: border-box;
    background: #fafafa;
}

input:focus {
    outline: none;
    border-color: #2d6cdf;
    background: #fff;
}

/* BUTTONS */
button {
    margin: 5px 0;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #2d6cdf;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #1f56b8;
}

button:disabled {
    background: #a9c0e8;
    cursor: default;
}

/* TEXT */
#result, #filename, #folderStatus, #authStatus {
    margin-top: 10px;
    font-size: 14px;
    text-align: center;
}

#folderStatus, #authStatus {
    font-size: 12px;
    color: #666;
}

#setupSection {
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
    margin-bottom: 10px;
}

#birdList {
    font-size: 12px;
    color: #444;
    margin-top: 8px;
    max-height: 90px;
    overflow-y: auto;
}

.button-row {
    display: flex;
    gap: 10px;
}

.button-row button {
    width: 50%;
}
</style>

<title>Vogelstimmen Quiz (iPhone)</title>
</head>

<body>

<div id="app">

<h1>🐦 Vogelstimmenquiz 🎧</h1>

<div id="setupSection">

    <h2>1️⃣ Mit Dropbox verbinden</h2>
    <button id="connectBtn" onclick="connectDropbox()">🔗 Mit Dropbox verbinden</button>
    <button id="disconnectBtn" class="secondary" onclick="disconnectDropbox()" style="display:none;">Verbindung trennen</button>
    <p id="authStatus">Noch nicht verbunden.</p>

    <h2>2️⃣ Ordnerpfad</h2>
    <input type="text" id="folderPathInput" placeholder="/Projekte/Vogelstimmen" value="/Projekte/Vogelstimmen">
    <button id="loadFolderBtn" onclick="loadFolder()" disabled>📂 Ordner laden</button>

    <p id="folderStatus">Noch keine Daten geladen.</p>
    <div id="birdList"></div>

    <h2>3️⃣ Quiz</h2>
    <button id="startQuizBtn" onclick="startQuiz()" disabled>🎮 Quiz starten</button>
</div>

<div id="hud">
<span id="questionText">📊 Frage 0/26</span>
<span>🏆 <span id="scoreDisplay">0</span></span>
</div>

<button onclick="startAudio()">🔊 Audio starten</button>
<button id="pauseBtn" class="secondary" onclick="togglePause()">⏸️ Pause</button>

<p id="filename"></p>
<p id="result"></p>

<input type="text" id="answer" placeholder="Vogel eingeben">

</div>

<script>
// ================= KONFIGURATION =================
const APP_KEY = "re4wqa9h1kyxymp";
const REDIRECT_URI = "https://jholzbrecher.github.io/vogeltraining_1.0/";

const AUDIO_EXT = /\.(mp3|wav|m4a|aac|ogg|flac)$/i;

let birdData = {};      // birdName -> array of Dropbox file paths
let playlist = [];

let currentBird = "";
let currentPath = null;
let currentAudio = null;

let isPaused = false;
let answeredCorrectly = false;

let questionIndex = 0;
let score = 0;
let attempts = 0;

let hadHardFail = false;

const MAX_QUESTIONS = 26;
const WIN_SCORE = 20;

// ================= PKCE HELPERS =================
function base64UrlEncode(buffer) {
    let str = btoa(String.fromCharCode(...new Uint8Array(buffer)));
    return str.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function randomString(length) {
    const arr = new Uint8Array(length);
    crypto.getRandomValues(arr);
    return base64UrlEncode(arr.buffer).slice(0, length);
}

async function sha256(text) {
    const data = new TextEncoder().encode(text);
    return await crypto.subtle.digest("SHA-256", data);
}

// ================= OAUTH LOGIN =================
async function connectDropbox() {
    const verifier = randomString(64);
    sessionStorage.setItem("dbx_code_verifier", verifier);

    const challengeBuffer = await sha256(verifier);
    const challenge = base64UrlEncode(challengeBuffer);

    const authUrl = "https://www.dropbox.com/oauth2/authorize"
        + "?client_id=" + encodeURIComponent(APP_KEY)
        + "&response_type=code"
        + "&code_challenge=" + encodeURIComponent(challenge)
        + "&code_challenge_method=S256"
        + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
        + "&token_access_type=offline";

    window.location.href = authUrl;
}

function disconnectDropbox() {
    localStorage.removeItem("dbx_access_token");
    localStorage.removeItem("dbx_refresh_token");
    updateAuthUI(false);
}

async function exchangeCodeForToken(code) {
    const verifier = sessionStorage.getItem("dbx_code_verifier");

    const params = new URLSearchParams();
    params.append("code", code);
    params.append("grant_type", "authorization_code");
    params.append("client_id", APP_KEY);
    params.append("redirect_uri", REDIRECT_URI);
    params.append("code_verifier", verifier);

    const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
    });

    const data = await res.json();

    if (data.access_token) {
        localStorage.setItem("dbx_access_token", data.access_token);
        if (data.refresh_token) {
            localStorage.setItem("dbx_refresh_token", data.refresh_token);
        }
        return true;
    }
    return false;
}

async function refreshAccessToken() {
    const refreshToken = localStorage.getItem("dbx_refresh_token");
    if (!refreshToken) return false;

    const params = new URLSearchParams();
    params.append("grant_type", "refresh_token");
    params.append("refresh_token", refreshToken);
    params.append("client_id", APP_KEY);

    const res = await fetch("https://api.dropboxapi.com/oauth2/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
    });

    const data = await res.json();

    if (data.access_token) {
        localStorage.setItem("dbx_access_token", data.access_token);
        return true;
    }
    return false;
}

function updateAuthUI(connected) {
    document.getElementById("connectBtn").style.display = connected ? "none" : "block";
    document.getElementById("disconnectBtn").style.display = connected ? "block" : "none";
    document.getElementById("authStatus").innerText = connected
        ? "✅ Mit Dropbox verbunden."
        : "Noch nicht verbunden.";
    document.getElementById("loadFolderBtn").disabled = !connected;
}

async function initAuth() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code");

    if (code) {
        document.getElementById("authStatus").innerText = "Verbinde mit Dropbox …";
        const ok = await exchangeCodeForToken(code);
        // URL wieder säubern, damit der Code nicht sichtbar bleibt / erneut verwendet wird
        window.history.replaceState({}, document.title, REDIRECT_URI);

        if (ok) {
            updateAuthUI(true);
            return;
        } else {
            document.getElementById("authStatus").innerText = "❌ Login fehlgeschlagen, bitte erneut versuchen.";
            return;
        }
    }

    if (localStorage.getItem("dbx_access_token")) {
        updateAuthUI(true);
    } else {
        updateAuthUI(false);
    }
}

// ================= DROPBOX API CALLS =================
async function dbxApiCall(url, body) {
    let token = localStorage.getItem("dbx_access_token");

    let res = await fetch(url, {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    if (res.status === 401) {
        // Token abgelaufen -> erneuern und nochmal versuchen
        const refreshed = await refreshAccessToken();
        if (!refreshed) throw new Error("Sitzung abgelaufen, bitte neu verbinden.");

        token = localStorage.getItem("dbx_access_token");
        res = await fetch(url, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });
    }

    if (!res.ok) {
        const errText = await res.text();
        throw new Error("Dropbox-Fehler: " + errText);
    }

    return await res.json();
}

async function loadFolder() {
    const folderPath = document.getElementById("folderPathInput").value.trim() || "";

    document.getElementById("folderStatus").innerText = "⏳ Lade Ordnerstruktur …";
    document.getElementById("startQuizBtn").disabled = true;
    birdData = {};

    try {
        let result = await dbxApiCall("https://api.dropboxapi.com/2/files/list_folder", {
            path: folderPath,
            recursive: true
        });

        processEntries(result.entries);

        while (result.has_more) {
            result = await dbxApiCall("https://api.dropboxapi.com/2/files/list_folder/continue", {
                cursor: result.cursor
            });
            processEntries(result.entries);
        }

        updateFolderStatus();

        if (Object.keys(birdData).length > 0) {
            document.getElementById("startQuizBtn").disabled = false;
        } else {
            document.getElementById("folderStatus").innerText =
                "Keine Audiodateien in Unterordnern gefunden. Pfad korrekt?";
        }

    } catch (err) {
        document.getElementById("folderStatus").innerText = "❌ " + err.message;
    }
}

function processEntries(entries) {
    for (let entry of entries) {
        if (entry[".tag"] !== "file") continue;
        if (!AUDIO_EXT.test(entry.name)) continue;

        const parts = entry.path_display.split("/").filter(p => p.length > 0);
        if (parts.length < 2) continue;

        const birdName = parts[parts.length - 2];

        if (!birdData[birdName]) birdData[birdName] = [];
        birdData[birdName].push(entry.path_lower);
    }
}

function updateFolderStatus() {
    const birds = Object.keys(birdData);
    let totalFiles = 0;
    for (let b of birds) totalFiles += birdData[b].length;

    document.getElementById("folderStatus").innerText =
        birds.length + " Vogelarten geladen (" + totalFiles + " Dateien).";

    document.getElementById("birdList").innerText =
        birds.map(b => b + " (" + birdData[b].length + ")").join(" · ");
}

async function getTemporaryLink(path) {
    const data = await dbxApiCall("https://api.dropboxapi.com/2/files/get_temporary_link", {
        path: path
    });
    return data.link;
}

// ================= HUD ================= 
function updateHUD() {
    document.getElementById("questionText").innerText =
        "📊 Frage " + (questionIndex + 1) + "/26";

    document.getElementById("scoreDisplay").innerText = score;
}

function startQuiz() {
    if (Object.keys(birdData).length === 0) {
        alert("Bitte zuerst einen Ordner laden.");
        return;
    }

    buildPlaylist();
    loadCurrentQuestion();
    updateHUD();
}

// ---------------- PLAYLIST ----------------
function buildPlaylist() {
    playlist = [];

    const birds = Object.keys(birdData);

    for (let bird of birds) {
        for (let path of birdData[bird]) {
            playlist.push({ bird, path });
        }
    }

    playlist.sort(() => Math.random() - 0.5);
    playlist = playlist.slice(0, MAX_QUESTIONS);

    questionIndex = 0;
    score = 0;
    hadHardFail = false;
}

// ---------------- QUESTION ----------------
function loadCurrentQuestion() {
    const item = playlist[questionIndex];
    if (!item) return;

    currentBird = item.bird;
    currentPath = item.path;

    attempts = 0;
    answeredCorrectly = false;

    updateHUD();
}

// ---------------- AUDIO ----------------
async function startAudio() {
    stopAudio();

    if (!currentPath) {
        loadCurrentQuestion();
        if (!currentPath) return;
    }

    try {
        document.getElementById("filename").innerText = "⏳ Lade Audio …";
        const url = await getTemporaryLink(currentPath);

        currentAudio = new Audio(url);
        currentAudio.loop = true;
        currentAudio.play();

        document.getElementById("filename").innerText = "";

        isPaused = false;
        updatePauseButton();
    } catch (err) {
        document.getElementById("filename").innerText = "❌ " + err.message;
    }
}

function togglePause() {
    if (!currentAudio) return;

    if (!isPaused) {
        currentAudio.pause();
        isPaused = true;
    } else {
        currentAudio.play();
        isPaused = false;
    }

    updatePauseButton();
}

function updatePauseButton() {
    document.getElementById("pauseBtn").innerText =
        isPaused ? "▶️ Fortsetzen" : "⏸️ Pause";
}

function stopAudio() {
    if (currentAudio) currentAudio.pause();
}

// ---------------- ANSWER ----------------
function checkAnswer() {
    const input = document.getElementById("answer");
    const guess = input.value.trim().toLowerCase();

    attempts++;

    if (guess === currentBird.toLowerCase()) {

        let points = 0;

        if (attempts === 1) points = 1;
        else if (attempts === 2) points = 0.5;
        else if (attempts === 3) points = 0.25;

        score += points;

        document.getElementById("result").innerText =
            `✅ Richtig! +${points} Punkte`;

        answeredCorrectly = true;
        updateHUD();

    } else {
        if (attempts >= 3) {
            document.getElementById("result").innerText =
                `❌ Falsch. Lösung: ${currentBird}`;

            hadHardFail = true;
            answeredCorrectly = true;

        } else {
            document.getElementById("result").innerText =
                `❌ Falsch! Versuch ${attempts}/3`;
            input.value = "";
        }
    }
}

// ---------------- NEXT ----------------
function nextQuestion() {
    stopAudio();

    currentAudio = null;
    currentPath = null;

    document.getElementById("answer").value = "";
    document.getElementById("result").innerText = "";
    document.getElementById("filename").innerText = "";

    questionIndex++;

    if (questionIndex >= MAX_QUESTIONS) {
        endGame();
        return;
    }

    loadCurrentQuestion();
    startAudio();
    updateHUD();
}

// ---------------- END GAME ----------------
function endGame() {

    let message = `📊 Spiel beendet!\nPunkte: ${score}`;

    if (score >= WIN_SCORE) {
        message = "🏆 Du hast 20 Punkte erreicht!";
    }

    if (!hadHardFail && score === MAX_QUESTIONS) {
        message += "\n🔥 PERFEKTE RUNDE! 26/26 ohne Fehler!";
    }

    alert(message);
    stopAudio();
}

// ---------------- ENTER ----------------
document.getElementById("answer").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        if (!answeredCorrectly && attempts < 3) {
            checkAnswer();
        } else {
            nextQuestion();
        }
    }
});

// ---------------- INIT ----------------
initAuth();
</script>

</body>
</html>
